<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c084fc"/> <!-- purple-400 -->
      <stop offset="100%" stop-color="#ec4899"/> <!-- pink-500 -->
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="#020617"/> <!-- slate-950 -->
  <g filter="url(#glow)">
    <!-- Base chart bars inside a "wrapped" gift box -->
    <path d="M 176 340 L 176 260 M 256 340 L 256 200 M 336 340 L 336 280" stroke="url(#grad)" stroke-width="24" stroke-linecap="round" fill="none"/>
    <!-- Box outline forming a ribbon/wrapping -->
    <rect x="136" y="150" width="240" height="220" rx="20" stroke="url(#grad)" stroke-width="16" fill="none"/>
    <!-- Ribbon cross -->
    <line x1="136" y1="240" x2="376" y2="240" stroke="url(#grad)" stroke-width="16"/>
    <!-- Bow -->
    <path d="M 256 150 C 230 110 190 120 210 150 C 230 180 256 150 256 150 M 256 150 C 280 110 320 120 300 150 C 280 180 256 150 256 150" stroke="url(#grad)" stroke-width="16" fill="none"/>
  </g>
</svg>